  - docs/runbooks/m4-engineering-missions.md
  acceptance_criteria:
  - The document identifies the milestone and states that no push or merge occurred.
  - The document records validation and review evidence locations.
  - No other repository file is changed.
  stop_conditions:
  - A requested change would leave the allowed path.
  - Validation fails for reasons outside this work item.
  - Credentials, deployment, or protected branches would be required.
deliverables:
- patch
- validation logs
- independent review
- PR bundle
approved_by: founder-operator
approval_reference: M4-ENGINEERING-PILOT-RETRY-2-APPROVAL
