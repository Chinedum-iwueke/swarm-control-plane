  max_tasks: 1
  max_attempts_per_task: 1
  max_duration_seconds: 1800
  max_files_changed: 1
  max_diff_lines: 120
work_items:
- id: record-pilot
  objective: Create docs/m4-engineering-pilot-result.md documenting the bounded pilot.
