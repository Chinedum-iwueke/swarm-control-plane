name: Platform observability

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  plat005:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded test surfaces
        run: |
          python -m pip install -r backend/requirements-dev.txt
          python -m pip install -e mission-control -e telegram-gateway
      - name: Verify observability contracts
        env:
          PYTHONPATH: backend:telegram-gateway/src:mission-control/src
          POSTGRES_PASSWORD_FILE: /etc/hostname
        run: |
          pytest -q backend/tests/test_unified_observability.py backend/tests/test_fleet_observability.py backend/tests/test_service_catalog.py
          pytest -q telegram-gateway/tests/test_gateway.py
          pytest -q mission-control/tests/test_control_plane.py
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          report = json.loads(Path("docs/evidence/plat005-report.json").read_text())
          expected = report.pop("report_digest")
          actual = hashlib.sha256(json.dumps(report, sort_keys=True, separators=(",", ":")).encode()).hexdigest()
          assert actual == expected
          PY
          node --check mission-control/src/hermes_mission_control/static/app.js
      - uses: actions/upload-artifact@v4
        with:
          name: plat005-observability-${{ github.sha }}
          path: docs/evidence/plat005-report.json
          if-no-files-found: error
          retention-days: 90
