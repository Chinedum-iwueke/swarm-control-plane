name: Alpha discovery contracts and event transactions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  alpha-discovery:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: disposable-test-only
          POSTGRES_DB: hermes_discovery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hermes_discovery_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Verify discovery contracts and real event-chain transaction
        env:
          PYTHONPATH: backend
          POSTGRES_PASSWORD_FILE: /etc/hostname
          ALPHA_DISCOVERY_TEST_DATABASE_URL: postgresql+psycopg://postgres:disposable-test-only@127.0.0.1:5432/hermes_discovery_test
        run: >-
          pytest -q backend/tests/test_alpha_discovery.py
          backend/tests/test_alpha_discovery_event_transaction.py
          backend/tests/test_backtest_activity.py
